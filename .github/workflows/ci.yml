name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: docrequest
          POSTGRES_PASSWORD: docrequest
          POSTGRES_DB: docrequest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U docrequest" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://docrequest:docrequest@localhost:5432/docrequest_test
      TEST_REDIS_URL: redis://localhost:6379/6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  # Builds both images and starts the full stack the way a self-hoster would.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create .env (ClamAV off to keep CI fast)
        run: |
          ./scripts/init-env.sh
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=localdb/; s/^CLAMAV_ENABLED=.*/CLAMAV_ENABLED=false/' .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Web and API answer through the proxy
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8020/api/health && break
            sleep 5
          done
          curl -fsS http://localhost:8020/login -o /dev/null
          curl -fsS http://localhost:8020/api/health
          curl -fsS http://localhost:8020/api/config
          test "$(docker compose ps --all --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ' | cut -d' ' -f2)" = "0"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
