# Optional: PostgreSQL and Redis for local development.
# Skip this if you already run them locally. Full self-hosting stack: docker-compose.yml (phase 6).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: docrequest
      POSTGRES_PASSWORD: docrequest
      POSTGRES_DB: docrequest
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']

volumes:
  pgdata:
